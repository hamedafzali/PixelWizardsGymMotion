name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Builds, then runs every test including the contact sweep over all exercises.
      - run: npm test
      - run: npm pack --dry-run
      # The website links the package from the repo root, so it builds against this commit.
      - run: npm ci && npm run build
        working-directory: site
